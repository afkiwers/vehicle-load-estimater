name: Release

# Publishing a release on GitHub builds the single-file app from the tagged
# commit, attaches it to the release as vehicle-load-estimator.html and publishes
# it to GitHub Pages as the gh-pages branch, served from its root.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Settings are stamped with package.json's version, so it must be the release's.
          want="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$want" ]; then
            echo "::error::Release tag $TAG does not match package.json version $want. Bump package.json first."
            exit 1
          fi
      - run: npm test
      - name: Build, stamped with the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          export APP_VERSION="$TAG"
          export APP_COMMIT="$(git rev-parse HEAD)"
          export APP_COMMIT_DATE="$(git log -1 --format=%cI)"
          export APP_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build
      - name: Attach vehicle-load-estimator.html to the release
        # Also under the app's old name, so download links from before the rename keep working.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp vehicle-load-estimator.html ute-load-estimator.html
          gh release upload "$TAG" vehicle-load-estimator.html ute-load-estimator.html --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Every release stays online at v/<version>/, so settings saved with it open in it; the
          # newest is also the root page, and versions.json lists them all.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            git clone -q --depth 1 --branch gh-pages "$remote" site
          else
            git init -q -b gh-pages site
          fi
          version="${TAG#v}"
          mkdir -p "site/v/$version"
          cp vehicle-load-estimator.html "site/v/$version/index.html"
          touch site/.nojekyll
          node scripts/versions-manifest.mjs site "$version"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $TAG"
          git push -q "$remote" HEAD:gh-pages
